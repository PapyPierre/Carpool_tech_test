[package]
name = "friend-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
redis = { version = "1.0.4", features = ["tokio-comp"] }
async-trait = "0.1.89"